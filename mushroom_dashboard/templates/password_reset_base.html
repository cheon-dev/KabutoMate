{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2e7d32">
    <title>{% block title %}Password Reset{% endblock %} - Kabutomate</title>
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
    <style>
        :root { --green: #2e7d32; --light-green: #4caf50; --ink: #1a202c; --muted: #64748b; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #f0f4f1; font-family: Arial, sans-serif; color: var(--ink); }
        .reset-card { width: min(100%, 440px); background: #fff; padding: 2.5rem; border-radius: 24px; box-shadow: 0 20px 55px rgba(46, 125, 50, .12); border: 1px solid rgba(46, 125, 50, .08); }
        .brand { color: var(--green); font-weight: 800; letter-spacing: .08em; margin-bottom: 2rem; }
        h1 { margin: 0 0 .7rem; font-size: 1.8rem; }
        p { color: var(--muted); line-height: 1.55; }
        label { display: block; margin: 1.4rem 0 .45rem; font-weight: 700; font-size: .9rem; }
        input { width: 100%; padding: .85rem 1rem; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; }
        input:focus { outline: 2px solid rgba(46, 125, 50, .2); border-color: var(--green); }
        button { width: 100%; margin-top: 1.4rem; padding: .9rem 1rem; border: 0; border-radius: 10px; background: var(--green); color: #fff; font-weight: 800; font-size: 1rem; cursor: pointer; }
        button:hover { background: #256b2a; }
        .back-link { display: inline-block; margin-top: 1.3rem; color: var(--green); font-weight: 700; text-decoration: none; }
        .errorlist { padding: .7rem 1rem; margin: .5rem 0; border-radius: 8px; background: #fef2f2; color: #991b1b; list-style: none; }
        .success { padding: 1rem; background: #f0fdf4; border-radius: 10px; color: #166534; }
        @media (max-width: 480px) { .reset-card { padding: 2rem 1.25rem; } }
    </style>
    {% include 'includes/page_loader_head.html' %}
</head>
<body>
    {% include 'includes/page_loader.html' %}
    <main class="reset-card">
        <div class="brand">KABUTOMATE</div>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
