<style>
    .ai-chatbot {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1200;
        font-family: inherit;
    }

    .ai-chatbot-launcher {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 52px;
        height: 52px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: #1f6b4f;
        color: #fff;
        box-shadow: 0 10px 28px rgba(17, 57, 42, .28);
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .ai-chatbot-launcher:hover,
    .ai-chatbot-launcher:focus-visible {
        background: #18533d;
    }

    .ai-chatbot-launcher:hover {
        transform: translateY(-2px) scale(1.04);
        box-shadow: 0 14px 32px rgba(17, 57, 42, .34);
    }

    .ai-chatbot-launcher.is-active {
        transform: rotate(90deg) scale(.94);
        box-shadow: 0 8px 22px rgba(17, 57, 42, .22);
    }

    .ai-chatbot-panel {
        position: absolute;
        right: 0;
        bottom: 62px;
        display: flex;
        flex-direction: column;
        width: min(380px, calc(100vw - 32px));
        height: min(570px, calc(100vh - 112px));
        overflow: hidden;
        border: 1px solid rgba(31, 107, 79, .18);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 55px rgba(23, 43, 35, .24);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(12px) scale(.96);
        transform-origin: bottom right;
        transition: opacity 220ms ease, transform 220ms cubic-bezier(.22, 1, .36, 1), visibility 220ms ease;
    }

    .ai-chatbot-panel[hidden] {
        display: none;
    }

    .ai-chatbot-panel.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0) scale(1);
    }

    .ai-chatbot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 17px 18px;
        background: #1f6b4f;
        color: #fff;
    }

    .ai-chatbot-title {
        margin: 0;
        font-size: 15px;
        letter-spacing: .01em;
    }

    .ai-chatbot-subtitle {
        margin: 3px 0 0;
        color: rgba(255, 255, 255, .76);
        font-size: 11px;
    }

    .ai-chatbot-close {
        border: 0;
        background: transparent;
        color: #fff;
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
    }

    .ai-chatbot-messages {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
        padding: 16px;
        background: #f7faf8;
    }

    .ai-chatbot-message {
        max-width: 86%;
        padding: 10px 12px;
        border-radius: 13px;
        color: #23352d;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .ai-chatbot-panel.is-open .ai-chatbot-message {
        animation: ai-chat-message-enter 240ms cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes ai-chat-message-enter {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .ai-chatbot-message strong {
        font-weight: 700;
    }

    .ai-chatbot-message em {
        font-style: italic;
    }

    .ai-chatbot-message.assistant {
        align-self: flex-start;
        border: 1px solid #e0ebe5;
        background: #fff;
    }

    .ai-chatbot-message.user {
        align-self: flex-end;
        background: #dcefe5;
    }

    .ai-chatbot-message.status {
        align-self: flex-start;
        color: #6b7c74;
        font-style: italic;
    }

    .ai-chatbot-form {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #e8eee9;
        background: #fff;
    }

    .ai-chatbot-input {
        flex: 1;
        min-height: 38px;
        max-height: 92px;
        resize: none;
        padding: 10px 11px;
        border: 1px solid #cfddd4;
        border-radius: 10px;
        color: #23352d;
        font: inherit;
        font-size: 13px;
        outline: none;
    }

    .ai-chatbot-input:focus {
        border-color: #1f6b4f;
        box-shadow: 0 0 0 3px rgba(31, 107, 79, .12);
    }

    .ai-chatbot-send {
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        border: 0;
        border-radius: 10px;
        background: #1f6b4f;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
    }

    .ai-chatbot-send:disabled,
    .ai-chatbot-input:disabled {
        cursor: wait;
        opacity: .65;
    }

    @media (prefers-reduced-motion: reduce) {
        .ai-chatbot-launcher,
        .ai-chatbot-panel,
        .ai-chatbot-panel.is-open .ai-chatbot-message {
            animation: none;
            transition-duration: 0ms;
        }
    }

    @media (max-width: 767px) {
        .ai-chatbot {
            right: 14px;
            bottom: 18px;
        }

        body:has(.customer-mobile-nav) .ai-chatbot {
            bottom: calc(82px + env(safe-area-inset-bottom));
        }

        .ai-chatbot-launcher {
            width: 46px;
            height: 46px;
        }

        .ai-chatbot-panel {
            right: -2px;
            bottom: 56px;
            height: min(570px, calc(100vh - 130px));
        }
    }
</style>

<div class="ai-chatbot" data-ai-chatbot>
    <button class="ai-chatbot-launcher" type="button" aria-label="Open KabutoMate AI chat" title="Open KabutoMate AI chat" aria-expanded="false" aria-controls="ai-chatbot-panel">
        <i class="fa-solid fa-message" aria-hidden="true"></i>
    </button>

    <section class="ai-chatbot-panel" id="ai-chatbot-panel" hidden aria-hidden="true" aria-label="KabutoMate AI assistant">
        <header class="ai-chatbot-header">
            <div>
                <h2 class="ai-chatbot-title">KabutoMate AI</h2>
                <p class="ai-chatbot-subtitle">Ask about the farm, shop, or your dashboard</p>
            </div>
            <button class="ai-chatbot-close" type="button" aria-label="Close AI assistant">&#10005;</button>
        </header>
        <div class="ai-chatbot-messages" aria-live="polite">
            <div class="ai-chatbot-message assistant">Hi. I can help you find your way around KabutoMate.</div>
        </div>
        <form class="ai-chatbot-form">
            {% csrf_token %}
            <textarea class="ai-chatbot-input" rows="1" maxlength="4000" placeholder="Type your question..." aria-label="Message KabutoMate AI"></textarea>
            <button class="ai-chatbot-send" type="submit" aria-label="Send message">&#8593;</button>
        </form>
    </section>
</div>

<script>
    (() => {
        const root = document.querySelector('[data-ai-chatbot]');
        if (!root) return;

        const launcher = root.querySelector('.ai-chatbot-launcher');
        const panel = root.querySelector('.ai-chatbot-panel');
        const closeButton = root.querySelector('.ai-chatbot-close');
        const messages = root.querySelector('.ai-chatbot-messages');
        const form = root.querySelector('.ai-chatbot-form');
        const input = root.querySelector('.ai-chatbot-input');
        const sendButton = root.querySelector('.ai-chatbot-send');
        const csrfToken = root.querySelector('[name=csrfmiddlewaretoken]').value;
        const history = [];
        let closeTimer = null;
        const PANEL_TRANSITION_MS = 220;

        function setOpen(open) {
            if (closeTimer) {
                window.clearTimeout(closeTimer);
                closeTimer = null;
            }

            if (open) {
                panel.hidden = false;
                panel.setAttribute('aria-hidden', 'false');
                launcher.classList.add('is-active');
                window.requestAnimationFrame(() => panel.classList.add('is-open'));
            } else {
                panel.classList.remove('is-open');
                panel.setAttribute('aria-hidden', 'true');
                launcher.classList.remove('is-active');
                closeTimer = window.setTimeout(() => {
                    panel.hidden = true;
                    closeTimer = null;
                }, PANEL_TRANSITION_MS);
            }

            launcher.setAttribute('aria-expanded', String(open));
            if (open) input.focus();
            else launcher.focus();
        }

        function addMessage(type, text) {
            const message = document.createElement('div');
            message.className = `ai-chatbot-message ${type}`;
            if (type === 'assistant') {
                message.innerHTML = formatAssistantMarkdown(text);
            } else {
                message.textContent = text;
            }
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
            return message;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function formatAssistantMarkdown(text) {
            return escapeHtml(text)
                .replace(/\*\*\*(.+?)\*\*\*/gs, '<strong><em>$1</em></strong>')
                .replace(/___(.+?)___/gs, '<strong><em>$1</em></strong>')
                .replace(/\*\*(.+?)\*\*/gs, '<strong>$1</strong>')
                .replace(/__(.+?)__/gs, '<strong>$1</strong>');
        }

        launcher.addEventListener('click', () => setOpen(panel.hidden));
        closeButton.addEventListener('click', () => setOpen(false));
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !panel.hidden) setOpen(false);
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text || sendButton.disabled) return;

            const previousHistory = history.slice(-10);
            addMessage('user', text);
            history.push({ role: 'user', text });
            input.value = '';
            input.disabled = true;
            sendButton.disabled = true;
            const status = addMessage('status', 'Thinking...');

            try {
                const response = await fetch('{% url "ai-chat-api" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ message: text, history: previousHistory })
                });
                const data = await response.json();
                status.remove();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'The assistant could not reply.');
                }
                addMessage('assistant', data.answer);
                history.push({ role: 'model', text: data.answer });
            } catch (error) {
                status.textContent = error.message || 'The assistant could not reply.';
                status.className = 'ai-chatbot-message assistant';
            } finally {
                input.disabled = false;
                sendButton.disabled = false;
                input.focus();
            }
        });

        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });
    })();
</script>
