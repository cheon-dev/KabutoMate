<style>
    .ai-chatbot {
        position: fixed;
        right: 24px;
        bottom: 24px;
        z-index: 1200;
        font-family: inherit;
    }

    .ai-chatbot-launcher {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 68px;
        height: 68px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        filter: drop-shadow(0 8px 10px rgba(17, 57, 42, .28));
        -webkit-tap-highlight-color: transparent;
        transition: transform 180ms ease, filter 180ms ease;
        animation: kabu-bob 3.2s ease-in-out infinite;
    }

    .ai-chatbot-launcher:hover,
    .ai-chatbot-launcher:focus-visible {
        transform: scale(1.07);
        filter: drop-shadow(0 12px 14px rgba(17, 57, 42, .34));
    }

    .ai-chatbot-launcher:focus-visible { outline: 3px solid rgba(34, 197, 94, .5); outline-offset: 2px; }
    .ai-chatbot-launcher.is-active { transform: scale(.94); animation-play-state: paused; }

    .kabu-svg { width: 100%; height: 100%; overflow: visible; pointer-events: none; }

    /* Kabu can be dragged anywhere along the screen */
    .ai-chatbot-launcher {
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
    }
    .ai-chatbot.is-dragging .ai-chatbot-launcher {
        cursor: grabbing;
        animation: none;
        transform: scale(1.12) rotate(-4deg);
        filter: drop-shadow(0 16px 18px rgba(17, 57, 42, .38));
    }
    .ai-chatbot.is-dragging .kabu-bubble { opacity: 0; visibility: hidden; }

    /* When Kabu sits on the left half, the speech bubble opens to its right */
    .ai-chatbot.is-left .kabu-bubble {
        right: auto;
        left: calc(100% + 2px);
        border-radius: 16px 16px 16px 4px;
        transform-origin: left bottom;
        transform: translateX(-10px) scale(.86);
    }
    .ai-chatbot.is-left .kabu-bubble.is-visible { transform: translateX(0) scale(1); }

    .kabu-arm {
        transform-origin: 67px 73px;
        animation: kabu-wave 3.2s ease-in-out infinite;
    }

    .kabu-eyes {
        transform-origin: 50px 70px;
        animation: kabu-blink 4.6s infinite;
    }

    @keyframes kabu-wave {
        0%, 52%, 100% { transform: rotate(0deg); }
        6% { transform: rotate(-22deg); }
        13% { transform: rotate(14deg); }
        20% { transform: rotate(-22deg); }
        27% { transform: rotate(14deg); }
        34% { transform: rotate(-16deg); }
        42% { transform: rotate(6deg); }
    }

    @keyframes kabu-blink {
        0%, 93%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(.08); }
    }

    @keyframes kabu-bob {
        0%, 100% { translate: 0 0; }
        50% { translate: 0 -4px; }
    }

    /* Speech bubble next to Kabu */
    .kabu-bubble {
        position: absolute;
        right: calc(100% + 2px);
        bottom: 18px;
        display: flex;
        align-items: center;
        gap: 6px;
        width: max-content;
        max-width: min(210px, calc(100vw - 112px));
        padding: 9px 13px;
        border: 1px solid rgba(31, 107, 79, .16);
        border-radius: 16px 16px 4px 16px;
        background: #fff;
        box-shadow: 0 10px 26px rgba(17, 57, 42, .18);
        color: #1f3b2e;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.3;
        cursor: pointer;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateX(10px) scale(.86);
        transform-origin: right bottom;
        transition: opacity 220ms ease, transform 260ms cubic-bezier(.22, 1.3, .36, 1), visibility 220ms ease;
    }

    .kabu-bubble[hidden] { display: none; }

    .kabu-bubble.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(0) scale(1);
    }

    .ai-chatbot-header-main { display: flex; align-items: center; gap: 10px; }
    .ai-chatbot-avatar {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
        padding: 3px;
        border-radius: 50%;
        background: #fff;
    }
    .ai-chatbot-avatar .kabu-svg { display: block; }

    .ai-chatbot-panel {
        position: fixed;
        right: 24px;
        bottom: 102px;
        display: flex;
        flex-direction: column;
        width: min(380px, calc(100vw - 32px));
        height: min(570px, calc(100vh - 112px));
        overflow: hidden;
        border: 1px solid rgba(31, 107, 79, .18);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 55px rgba(23, 43, 35, .24);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(12px) scale(.96);
        transform-origin: bottom right;
        transition: opacity 220ms ease, transform 220ms cubic-bezier(.22, 1, .36, 1), visibility 220ms ease;
    }

    .ai-chatbot-panel[hidden] {
        display: none;
    }

    .ai-chatbot-panel.is-open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0) scale(1);
    }

    .ai-chatbot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 17px 18px;
        background: #1f6b4f;
        color: #fff;
    }

    .ai-chatbot-title {
        margin: 0;
        font-size: 15px;
        letter-spacing: .01em;
    }

    .ai-chatbot-subtitle {
        margin: 3px 0 0;
        color: rgba(255, 255, 255, .76);
        font-size: 11px;
    }

    .ai-chatbot-close {
        border: 0;
        background: transparent;
        color: #fff;
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
    }

    .ai-chatbot-messages {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
        padding: 16px;
        background: #f7faf8;
    }

    .ai-chatbot-message {
        max-width: 86%;
        padding: 10px 12px;
        border-radius: 13px;
        color: #23352d;
        font-size: 13px;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .ai-chatbot-panel.is-open .ai-chatbot-message {
        animation: ai-chat-message-enter 240ms cubic-bezier(.22, 1, .36, 1) both;
    }

    @keyframes ai-chat-message-enter {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .ai-chatbot-message strong {
        font-weight: 700;
    }

    .ai-chatbot-message em {
        font-style: italic;
    }

    .ai-chatbot-message.assistant {
        align-self: flex-start;
        border: 1px solid #e0ebe5;
        background: #fff;
    }

    .ai-chatbot-message.user {
        align-self: flex-end;
        background: #dcefe5;
    }

    .ai-chatbot-message.status {
        align-self: flex-start;
        color: #6b7c74;
        font-style: italic;
    }

    .ai-chatbot-form {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #e8eee9;
        background: #fff;
    }

    .ai-chatbot-input {
        flex: 1;
        min-height: 38px;
        max-height: 92px;
        resize: none;
        padding: 10px 11px;
        border: 1px solid #cfddd4;
        border-radius: 10px;
        color: #23352d;
        font: inherit;
        font-size: 13px;
        outline: none;
    }

    .ai-chatbot-input:focus {
        border-color: #1f6b4f;
        box-shadow: 0 0 0 3px rgba(31, 107, 79, .12);
    }

    .ai-chatbot-send {
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        border: 0;
        border-radius: 10px;
        background: #1f6b4f;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
    }

    .ai-chatbot-send:disabled,
    .ai-chatbot-input:disabled {
        cursor: wait;
        opacity: .65;
    }

    @media (prefers-reduced-motion: reduce) {
        .ai-chatbot-launcher,
        .kabu-arm,
        .kabu-eyes,
        .ai-chatbot-panel,
        .ai-chatbot-panel.is-open .ai-chatbot-message {
            animation: none;
            transition-duration: 0ms;
        }
    }

    @media (max-width: 767px) {
        .ai-chatbot {
            right: 14px;
            bottom: 18px;
        }

        body:has(.customer-mobile-nav) .ai-chatbot {
            bottom: calc(96px + env(safe-area-inset-bottom));
        }

        .ai-chatbot-launcher {
            width: 60px;
            height: 60px;
        }

        .kabu-bubble { bottom: 14px; font-size: 12.5px; }

        .ai-chatbot-panel {
            right: 12px;
            bottom: 86px;
            width: min(380px, calc(100vw - 24px));
            height: min(570px, calc(100vh - 130px));
        }

        body:has(.customer-mobile-nav) .ai-chatbot-panel {
            bottom: calc(164px + env(safe-area-inset-bottom));
            height: min(570px, calc(100vh - 200px));
        }
    }
</style>

<script>
    (() => {
        const root = document.querySelector('[data-ai-chatbot]');
        if (!root) return;

        const launcher = root.querySelector('.ai-chatbot-launcher');
        const panel = root.querySelector('.ai-chatbot-panel');
        const closeButton = root.querySelector('.ai-chatbot-close');
        const messages = root.querySelector('.ai-chatbot-messages');
        const form = root.querySelector('.ai-chatbot-form');
        const input = root.querySelector('.ai-chatbot-input');
        const sendButton = root.querySelector('.ai-chatbot-send');
        const csrfToken = root.querySelector('[name=csrfmiddlewaretoken]').value;
        const history = [];
        let closeTimer = null;
        const PANEL_TRANSITION_MS = 220;

        function setOpen(open) {
            if (closeTimer) {
                window.clearTimeout(closeTimer);
                closeTimer = null;
            }

            if (open) {
                panel.hidden = false;
                panel.setAttribute('aria-hidden', 'false');
                launcher.classList.add('is-active');
                window.requestAnimationFrame(() => panel.classList.add('is-open'));
            } else {
                panel.classList.remove('is-open');
                panel.setAttribute('aria-hidden', 'true');
                launcher.classList.remove('is-active');
                closeTimer = window.setTimeout(() => {
                    panel.hidden = true;
                    closeTimer = null;
                }, PANEL_TRANSITION_MS);
            }

            launcher.setAttribute('aria-expanded', String(open));
            if (open) input.focus();
            else launcher.focus();
        }

        function addMessage(type, text) {
            const message = document.createElement('div');
            message.className = `ai-chatbot-message ${type}`;
            if (type === 'assistant') {
                message.innerHTML = formatAssistantMarkdown(text);
            } else {
                message.textContent = text;
            }
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
            return message;
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function formatAssistantMarkdown(text) {
            return escapeHtml(text)
                .replace(/\*\*\*(.+?)\*\*\*/gs, '<strong><em>$1</em></strong>')
                .replace(/___(.+?)___/gs, '<strong><em>$1</em></strong>')
                .replace(/\*\*(.+?)\*\*/gs, '<strong>$1</strong>')
                .replace(/__(.+?)__/gs, '<strong>$1</strong>');
        }

        // ---- Kabu's speech bubble ----
        const bubble = root.querySelector('.kabu-bubble');
        const bubbleText = bubble.querySelector('.kabu-bubble-text');
        const tips = [
            'Hi, I\u2019m Kabu! \uD83D\uDC4B',
            'Do you have a question?',
            'Need help finding mushrooms? \uD83C\uDF44',
            'Ask me about orders or delivery!',
            'Tap me to chat!',
            'Drag me anywhere you like! \u2728'
        ];
        const DISMISS_KEY = 'kabutomate:kabu-bubble-dismissed';
        let tipIndex = 0;
        let tipTimer = null;
        let bubbleDismissed = false;
        try { bubbleDismissed = window.sessionStorage.getItem(DISMISS_KEY) === '1'; } catch (error) { /* ignore */ }

        function stopTips() {
            if (tipTimer) { window.clearTimeout(tipTimer); tipTimer = null; }
            bubble.classList.remove('is-visible');
            window.setTimeout(() => { if (!bubble.classList.contains('is-visible')) bubble.hidden = true; }, 280);
        }

        function showTip() {
            if (bubbleDismissed || !panel.hidden) return;
            bubble.hidden = false;
            bubbleText.textContent = tips[tipIndex % tips.length];
            tipIndex += 1;
            window.requestAnimationFrame(() => bubble.classList.add('is-visible'));
            tipTimer = window.setTimeout(hideTip, 5200);
        }

        function hideTip() {
            bubble.classList.remove('is-visible');
            tipTimer = window.setTimeout(() => {
                if (!bubble.classList.contains('is-visible')) bubble.hidden = true;
                showTip();
            }, 3800);
        }

        function dismissBubble() {
            bubbleDismissed = true;
            try { window.sessionStorage.setItem(DISMISS_KEY, '1'); } catch (error) { /* ignore */ }
            stopTips();
        }

        bubble.addEventListener('click', () => { dismissBubble(); setOpen(true); });
        if (!bubbleDismissed) tipTimer = window.setTimeout(showTip, 1800);

        // ---- Drag Kabu anywhere on the screen ----
        const POSITION_KEY = 'kabutomate:kabu-position';
        const EDGE = 10;
        const DRAG_THRESHOLD = 8;
        let drag = null;
        let justDragged = false;

        function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }

        function dragBounds() {
            const rect = root.getBoundingClientRect();
            const nav = document.querySelector('.customer-mobile-nav');
            const navVisible = nav && window.getComputedStyle(nav).display !== 'none';
            const bottomGap = navVisible ? 92 : EDGE;
            return {
                width: rect.width,
                minX: EDGE,
                maxX: Math.max(EDGE, window.innerWidth - rect.width - EDGE),
                minY: EDGE,
                maxY: Math.max(EDGE, window.innerHeight - rect.height - bottomGap)
            };
        }

        function placeKabu(x, y, animate) {
            const bounds = dragBounds();
            root.style.transition = animate
                ? 'left .3s cubic-bezier(.22, 1, .36, 1), top .3s cubic-bezier(.22, 1, .36, 1)'
                : 'none';
            root.style.left = x + 'px';
            root.style.top = y + 'px';
            root.style.right = 'auto';
            root.style.bottom = 'auto';
            root.classList.toggle('is-left', x + bounds.width / 2 < window.innerWidth / 2);
        }

        function savePosition(side, yRatio) {
            try { window.localStorage.setItem(POSITION_KEY, JSON.stringify({ side: side, y: yRatio })); } catch (error) { /* ignore */ }
        }

        function applySavedPosition(animate) {
            let saved = null;
            try { saved = JSON.parse(window.localStorage.getItem(POSITION_KEY) || 'null'); } catch (error) { /* ignore */ }
            if (!saved || (saved.side !== 'left' && saved.side !== 'right')) return;
            const bounds = dragBounds();
            const x = saved.side === 'left' ? bounds.minX : bounds.maxX;
            const y = bounds.minY + clamp(Number(saved.y) || 0, 0, 1) * (bounds.maxY - bounds.minY);
            placeKabu(x, y, animate);
        }

        launcher.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            const rect = root.getBoundingClientRect();
            drag = { id: event.pointerId, startX: event.clientX, startY: event.clientY, originX: rect.left, originY: rect.top, moved: false };
        });

        launcher.addEventListener('pointermove', (event) => {
            if (!drag || event.pointerId !== drag.id) return;
            const dx = event.clientX - drag.startX;
            const dy = event.clientY - drag.startY;
            if (!drag.moved) {
                if (Math.hypot(dx, dy) < DRAG_THRESHOLD) return;
                drag.moved = true;
                if (launcher.setPointerCapture) { try { launcher.setPointerCapture(event.pointerId); } catch (error) { /* ignore */ } }
                root.classList.add('is-dragging');
            }
            event.preventDefault();
            const bounds = dragBounds();
            placeKabu(clamp(drag.originX + dx, bounds.minX, bounds.maxX), clamp(drag.originY + dy, bounds.minY, bounds.maxY), false);
        });

        function endDrag(event) {
            if (!drag || (event && event.pointerId !== drag.id)) return;
            const moved = drag.moved;
            drag = null;
            if (!moved) return;
            justDragged = true;
            window.setTimeout(() => { justDragged = false; }, 60);
            root.classList.remove('is-dragging');
            const rect = root.getBoundingClientRect();
            const bounds = dragBounds();
            const side = rect.left + rect.width / 2 < window.innerWidth / 2 ? 'left' : 'right';
            const y = clamp(rect.top, bounds.minY, bounds.maxY);
            placeKabu(side === 'left' ? bounds.minX : bounds.maxX, y, true);
            savePosition(side, bounds.maxY > bounds.minY ? (y - bounds.minY) / (bounds.maxY - bounds.minY) : 0);
        }

        launcher.addEventListener('pointerup', endDrag);
        launcher.addEventListener('pointercancel', endDrag);
        window.addEventListener('resize', () => applySavedPosition(false));
        window.addEventListener('orientationchange', () => applySavedPosition(false));
        applySavedPosition(false);

        launcher.addEventListener('click', () => {
            if (justDragged) return;
            dismissBubble();
            setOpen(panel.hidden);
        });
        closeButton.addEventListener('click', () => setOpen(false));
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !panel.hidden) setOpen(false);
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text || sendButton.disabled) return;

            const previousHistory = history.slice(-10);
            addMessage('user', text);
            history.push({ role: 'user', text });
            input.value = '';
            input.disabled = true;
            sendButton.disabled = true;
            const status = addMessage('status', 'Kabu is thinking...');

            try {
                const response = await fetch('{% url "ai-chat-api" %}', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({ message: text, history: previousHistory })
                });
                const data = await response.json();
                status.remove();
                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Kabu could not reply right now. Please try again.');
                }
                addMessage('assistant', data.answer);
                history.push({ role: 'model', text: data.answer });
            } catch (error) {
                status.textContent = error.message || 'Kabu could not reply right now. Please try again.';
                status.className = 'ai-chatbot-message assistant';
            } finally {
                input.disabled = false;
                sendButton.disabled = false;
                input.focus();
            }
        });

        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });
    })();
</script>
